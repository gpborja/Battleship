<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalla Naval</title>
<style>
  :root{--bg:#0f2a5c;--panel:#0b1f45e6;--water:#0b7f8c;--water2:#12a3b2;--ship:#c8693a;--hit:#ce1126;--miss:#ffffff;--sunk:#6b0d1a;--txt:#fff8ec;--accent:#f7a800;--rosa:#e4007c;--verde:#006847;--rojo:#ce1126}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:0 16px 64px;
    background:radial-gradient(circle,#ffffff14 0 5px,transparent 6px) 0 0/48px 48px,radial-gradient(circle,#f7a80018 0 3px,transparent 4px) 24px 24px/48px 48px,conic-gradient(from 45deg,#13336e 25%,var(--bg) 0 50%,#13336e 0 75%,var(--bg) 0) 0 0/48px 48px;background-color:var(--bg)}
  #papel{width:calc(100% + 32px);display:flex;gap:6px;padding:0 8px;border-top:3px solid #3b2a1a;margin-bottom:6px}
  #papel span{flex:1;height:44px;max-width:70px;clip-path:polygon(0 0,100% 0,100% 82%,87.5% 100%,75% 82%,62.5% 100%,50% 82%,37.5% 100%,25% 82%,12.5% 100%,0 82%);
    -webkit-mask:radial-gradient(circle,transparent 0 3px,#000 4px) 0 0/12px 12px;mask:radial-gradient(circle,transparent 0 3px,#000 4px) 0 0/12px 12px}
  #papel span:nth-child(6n+1){background:var(--rosa)}#papel span:nth-child(6n+2){background:var(--accent)}#papel span:nth-child(6n+3){background:var(--verde)}
  #papel span:nth-child(6n+4){background:#00a6d6}#papel span:nth-child(6n+5){background:var(--rojo)}#papel span:nth-child(6n){background:#8e44ad}
  h1{margin:4px 0 0;letter-spacing:6px;font-size:38px;background:linear-gradient(90deg,var(--verde) 0 33%,#fff 33% 66%,var(--rojo) 66%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px #ffffff55;filter:drop-shadow(0 2px 2px #0008)}
  .subtitle{font-family:"Brush Script MT","Segoe Script",cursive;font-size:26px;color:var(--accent);margin-top:-2px}
  #status{min-height:28px;margin:8px 0 12px;font-size:18px;color:var(--accent);text-align:center}
  .boards{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
  .board-wrap{background:var(--panel);padding:12px 14px 14px;border-radius:10px;border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 3px var(--accent),0 6px 18px #0009;position:relative}
  .board-wrap::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;border-radius:7px 7px 0 0;background:linear-gradient(90deg,var(--verde) 0 33%,#fff 33% 66%,var(--rojo) 66%)}
  .board-wrap h2{margin:4px 0 8px;font-size:16px;text-align:center;font-weight:700;color:var(--accent)}
  .grid{display:grid;grid-template-columns:22px repeat(10,32px);grid-template-rows:22px repeat(10,32px);gap:2px}
  .lbl{display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.8}
  .cell{background:var(--water);border-radius:3px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none}
  .cell.ship{background:var(--ship);box-shadow:inset 0 0 0 2px #ffffff30}
  .cell.preview{background:#00a86baa}
  .cell.preview.bad{background:#ce1126aa}
  .cell.miss::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--miss)}
  .cell.hit{background:var(--hit)}
  .cell.hit::after{content:"✕";color:#fff;font-size:18px}
  .cell.sunk{background:var(--sunk)}
  #enemy.active .cell:not(.hit):not(.miss){cursor:crosshair}
  #enemy.active .cell:not(.hit):not(.miss):hover{background:var(--water2);outline:2px solid var(--accent)}
  #player.placing .cell{cursor:pointer}
  .controls{margin:14px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{background:var(--accent);color:#1a1a1a;border:0;border-radius:6px;padding:8px 16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #0006}
  button:disabled{opacity:.4;cursor:default}
  button.secondary{background:var(--rosa);color:#fff}
  .fleet{margin-top:10px;font-size:13px;display:flex;flex-direction:column;gap:3px}
  .fleet span.gone{text-decoration:line-through;opacity:.45}
  .fleet .cur{color:var(--accent);font-weight:700}
  #log{width:min(720px,100%);max-height:140px;overflow:auto;background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.5;border-left:4px solid var(--rosa)}
  .hint{font-size:13px;opacity:.85;margin-bottom:6px;text-align:center}
  #stocks{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;background:#0a1a3a;border-top:3px solid;border-image:linear-gradient(90deg,var(--verde) 0 33%,#fff 33% 66%,var(--rojo) 66%) 1}
  #stocks .tag{flex:none;padding:0 12px;font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;background:var(--rosa);align-self:stretch;display:flex;align-items:center}
  #stocks .tradingview-widget-container{flex:1;min-width:0}
  #result{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#000b;padding:16px}
  #result.show{display:flex}
  #result .card{position:relative;max-width:440px;width:100%;text-align:center;background:var(--panel);border-radius:14px;padding:30px 24px 22px;box-shadow:0 0 0 4px var(--accent),0 12px 40px #000c;animation:pop .35s ease-out}
  #result .card::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-radius:12px 12px 0 0;background:linear-gradient(90deg,var(--verde) 0 33%,#fff 33% 66%,var(--rojo) 66%)}
  #result .icon{font-size:56px;line-height:1}
  #result .big{margin:10px 0 4px;font-size:40px;font-weight:800;letter-spacing:2px}
  #result .who{font-size:22px;font-weight:700;margin-bottom:8px}
  #result .why{font-size:15px;opacity:.9;margin-bottom:18px}
  #result.win .big{color:var(--accent)}
  #result.lose .big{color:#ff4d6a}
  #result .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  @media (max-width:480px){
    h1{font-size:28px;letter-spacing:3px}
    body{padding-left:8px;padding-right:8px}
    #papel{width:calc(100% + 16px)}
    .boards{width:100%}
    .board-wrap{width:100%;max-width:396px;padding:10px 8px 12px}
    .grid{grid-template-columns:18px repeat(10,minmax(0,1fr));grid-template-rows:18px;grid-auto-rows:auto}
    .cell{aspect-ratio:1}
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="papel" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<h1>BATALLA NAVAL</h1>
<div class="subtitle">✦ ¡Hunde la flota enemiga! ✦</div>
<div id="status"></div>
<div class="hint" id="hint">Coloca tu flota: haz clic en tu tablero para colocar el barco resaltado. Presiona <b>R</b> o «Girar» para cambiar la orientación.</div>
<div class="controls">
  <button id="rotate" class="secondary">Girar (horizontal)</button>
  <button id="random" class="secondary">Colocación aleatoria</button>
  <button id="reset" class="secondary">Borrar</button>
  <button id="start" disabled>Iniciar batalla</button>
  <button id="again" style="display:none">Jugar de nuevo</button>
</div>
<div class="boards">
  <div class="board-wrap"><h2>Tu flota</h2><div id="player" class="grid placing"></div><div class="fleet" id="pfleet"></div></div>
  <div class="board-wrap"><h2>Aguas enemigas</h2><div id="enemy" class="grid"></div><div class="fleet" id="efleet"></div></div>
</div>
<div style="height:14px"></div>
<div id="log"></div>
<div id="result" role="alertdialog" aria-modal="true" aria-labelledby="result-big" aria-describedby="result-who result-why">
  <div class="card">
    <div class="icon" id="result-icon"></div>
    <div class="big" id="result-big"></div>
    <div class="who" id="result-who"></div>
    <div class="why" id="result-why"></div>
    <div class="actions">
      <button id="result-again">Jugar de nuevo</button>
      <button id="result-close" class="secondary">Ver tableros</button>
    </div>
  </div>
</div>
<div id="stocks">
  <div class="tag">LOS 7 MAGNÍFICOS</div>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        {"proName": "NASDAQ:AAPL", "title": "Apple"},
        {"proName": "NASDAQ:MSFT", "title": "Microsoft"},
        {"proName": "NASDAQ:GOOGL", "title": "Alphabet"},
        {"proName": "NASDAQ:AMZN", "title": "Amazon"},
        {"proName": "NASDAQ:NVDA", "title": "NVIDIA"},
        {"proName": "NASDAQ:META", "title": "Meta"},
        {"proName": "NASDAQ:TSLA", "title": "Tesla"}
      ],
      "showSymbolLogo": true,
      "isTransparent": true,
      "displayMode": "adaptive",
      "colorTheme": "dark",
      "locale": "es"
    }
    </script>
  </div>
</div>

<script>
const N = 10, COLS = "ABCDEFGHIJ";
const FLEET = [["Trajinera",5],["Lancha",4],["Pesero",3],["Camión",3],["Bicitaxi",2]];
const $ = id => document.getElementById(id);
const name = (r,c) => COLS[c] + (r+1);

let state;

function newBoard(){
  return {cells: Array.from({length:N},()=>Array(N).fill(null)), shots: Array.from({length:N},()=>Array(N).fill(0)), ships: []};
}
function canPlace(b,r,c,len,horiz){
  for(let i=0;i<len;i++){
    const rr = r + (horiz?0:i), cc = c + (horiz?i:0);
    if(rr<0||rr>=N||cc<0||cc>=N||b.cells[rr][cc]!==null) return false;
  }
  return true;
}
function place(b,r,c,len,horiz,nm){
  const ship = {name:nm,len,cells:[],hits:0};
  for(let i=0;i<len;i++){
    const rr = r + (horiz?0:i), cc = c + (horiz?i:0);
    b.cells[rr][cc] = b.ships.length; ship.cells.push([rr,cc]);
  }
  b.ships.push(ship);
}
function randomFleet(b){
  for(const [nm,len] of FLEET){
    let ok=false;
    while(!ok){
      const h = Math.random()<.5, r = Math.floor(Math.random()*N), c = Math.floor(Math.random()*N);
      if(canPlace(b,r,c,len,h)){ place(b,r,c,len,h,nm); ok=true; }
    }
  }
}

function buildGrid(el, onClick, onHover){
  el.innerHTML = "";
  el.appendChild(Object.assign(document.createElement("div"),{className:"lbl"}));
  for(let c=0;c<N;c++) el.appendChild(Object.assign(document.createElement("div"),{className:"lbl",textContent:COLS[c]}));
  for(let r=0;r<N;r++){
    el.appendChild(Object.assign(document.createElement("div"),{className:"lbl",textContent:r+1}));
    for(let c=0;c<N;c++){
      const d = document.createElement("div");
      d.className="cell"; d.dataset.r=r; d.dataset.c=c;
      if(onClick) d.addEventListener("click",()=>onClick(r,c));
      if(onHover){ d.addEventListener("mouseenter",()=>onHover(r,c)); }
      el.appendChild(d);
    }
  }
  if(onHover) el.addEventListener("mouseleave",()=>onHover(-1,-1));
}
const cellEl = (el,r,c) => el.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);

function render(){
  const P=$("player"), E=$("enemy");
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const pc = cellEl(P,r,c), ec = cellEl(E,r,c);
    const pi = state.player.cells[r][c], ps = state.player.shots[r][c];
    pc.className = "cell" + (pi!==null?" ship":"") + (ps===1?" miss":"") + (ps===2?" hit":"");
    if(ps===2 && state.player.ships[pi].hits===state.player.ships[pi].len) pc.classList.add("sunk");
    const ei = state.enemy.cells[r][c], es = state.enemy.shots[r][c];
    ec.className = "cell" + (es===1?" miss":"") + (es===2?" hit":"");
    if(es===2 && state.enemy.ships[ei].hits===state.enemy.ships[ei].len) ec.classList.add("sunk");
    if(state.phase==="over" && ei!==null && es===0) ec.classList.add("ship");
  }
  E.classList.toggle("active", state.phase==="battle" && state.turn==="player");
  P.classList.toggle("placing", state.phase==="placing");
  renderFleet($("pfleet"), state.player, state.phase==="placing");
  renderFleet($("efleet"), state.enemy, false);
  $("start").disabled = !(state.phase==="placing" && state.player.ships.length===FLEET.length);
  ["rotate","random","reset","start"].forEach(id=>$(id).style.display = state.phase==="placing"?"":"none");
  $("again").style.display = state.phase==="over"?"":"none";
  $("hint").style.display = state.phase==="placing"?"":"none";
  $("rotate").textContent = "Girar (" + (state.horiz?"horizontal":"vertical") + ")";
}
function renderFleet(el,b,placing){
  el.innerHTML = FLEET.map(([nm,len],i)=>{
    const s = b.ships.find(x=>x.name===nm);
    const gone = s && s.hits===s.len;
    const cur = placing && i===b.ships.length;
    return `<span class="${gone?"gone":""} ${cur?"cur":""}">${cur?"▶ ":""}${nm} (${len})${placing&&s?" ✓":""}</span>`;
  }).join("");
}
function announce(win){
  const R=$("result");
  R.className = "show " + (win?"win":"lose");
  for(const el of document.body.children) if(el!==R) el.inert = true;
  $("result-icon").textContent = win ? "★" : "⚓";
  $("result-big").textContent = win ? "¡GANASTE!" : "¡PERDISTE!";
  $("result-who").textContent = win ? "¡Eres el GANADOR!" : "¡Eres el PERDEDOR!";
  $("result-why").textContent = win ? "Hundiste toda la flota enemiga." : "El enemigo hundió toda tu flota.";
  $("result-again").focus();
}
function hideResult(){
  const R=$("result");
  if(!R.classList.contains("show")) return;
  R.className = "";
  for(const el of document.body.children) el.inert = false;
  if(state.phase==="over") $("again").focus();
}
function setStatus(t){ $("status").textContent=t; }
function log(t){ const d=document.createElement("div"); d.textContent=t; $("log").prepend(d); }

function hoverPlace(r,c){
  if(state.phase!=="placing") return;
  const P=$("player");
  P.querySelectorAll(".preview").forEach(x=>x.classList.remove("preview","bad"));
  if(r<0 || state.player.ships.length>=FLEET.length) return;
  const len = FLEET[state.player.ships.length][1];
  const ok = canPlace(state.player,r,c,len,state.horiz);
  for(let i=0;i<len;i++){
    const rr = r+(state.horiz?0:i), cc = c+(state.horiz?i:0);
    if(rr<N&&cc<N){ const e=cellEl(P,rr,cc); e.classList.add("preview"); if(!ok) e.classList.add("bad"); }
  }
  state.hover=[r,c];
}
function clickPlace(r,c){
  if(state.phase!=="placing" || state.player.ships.length>=FLEET.length) return;
  const [nm,len] = FLEET[state.player.ships.length];
  if(!canPlace(state.player,r,c,len,state.horiz)) return;
  place(state.player,r,c,len,state.horiz,nm);
  render(); hoverPlace(r,c);
  setStatus(state.player.ships.length===FLEET.length ? "¡Flota lista! Presiona «Iniciar batalla»." : `Coloca tu ${FLEET[state.player.ships.length][0]} (${FLEET[state.player.ships.length][1]}).`);
}

function fire(b,r,c){
  const i = b.cells[r][c];
  if(i===null){ b.shots[r][c]=1; return {result:"miss"}; }
  b.shots[r][c]=2; const s=b.ships[i]; s.hits++;
  return s.hits===s.len ? {result:"sunk",ship:s} : {result:"hit",ship:s};
}
const allSunk = b => b.ships.every(s=>s.hits===s.len);

function playerFire(r,c){
  if(state.phase!=="battle"||state.turn!=="player"||state.enemy.shots[r][c]) return;
  const res = fire(state.enemy,r,c);
  log(`Disparas a ${name(r,c)}: ${res.result==="miss"?"agua.":res.result==="hit"?"¡TOCADO!":"¡TOCADO Y HUNDIDO! Hundiste su "+res.ship.name+"."}`);
  if(allSunk(state.enemy)){ state.phase="over"; render(); setStatus("¡Victoria! Hundiste toda la flota enemiga."); log("¡Ganaste!"); announce(true); return; }
  state.turn="ai"; render();
  setStatus(res.result==="miss"?"Agua. El enemigo está apuntando...":res.result==="hit"?"¡Tocado! El enemigo está apuntando...":`¡Hundiste su ${res.ship.name}! El enemigo está apuntando...`);
  setTimeout(aiTurn, 650);
}

// AI: hunt with checkerboard parity, then target adjacent cells after a hit, following the line.
function aiPick(){
  const b = state.player, sh = b.shots;
  const open = (r,c)=> r>=0&&r<N&&c>=0&&c<N&&sh[r][c]===0;
  // unresolved hits = hits on ships not yet sunk
  const hits=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    if(sh[r][c]===2){ const s=b.ships[b.cells[r][c]]; if(s.hits<s.len) hits.push([r,c]); }
  }
  if(hits.length){
    // try to extend lines of 2+ adjacent hits
    const cands=[];
    for(const [r,c] of hits){
      for(const [dr,dc] of [[0,1],[1,0]]){
        if(hits.some(([a,bb])=>a===r+dr&&bb===c+dc)){
          let rr=r,cc=c; while(sh[rr]&&sh[rr][cc]===2&&hits.some(([a,bb])=>a===rr&&bb===cc)){rr-=dr;cc-=dc;}
          if(open(rr,cc)) cands.push([rr,cc]);
          rr=r;cc=c; while(sh[rr]&&sh[rr][cc]===2&&hits.some(([a,bb])=>a===rr&&bb===cc)){rr+=dr;cc+=dc;}
          if(open(rr,cc)) cands.push([rr,cc]);
        }
      }
    }
    if(cands.length) return cands[Math.floor(Math.random()*cands.length)];
    const adj=[];
    for(const [r,c] of hits) for(const [dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]]) if(open(r+dr,c+dc)) adj.push([r+dr,c+dc]);
    if(adj.length) return adj[Math.floor(Math.random()*adj.length)];
  }
  // hunt: score cells by how many remaining ships could fit through them
  const remaining = b.ships.filter(s=>s.hits<s.len).map(s=>s.len);
  const score = Array.from({length:N},()=>Array(N).fill(0));
  for(const len of remaining) for(let r=0;r<N;r++) for(let c=0;c<N;c++) for(const h of [true,false]){
    let ok=true; for(let i=0;i<len;i++){ const rr=r+(h?0:i), cc=c+(h?i:0); if(!open(rr,cc)){ok=false;break;} }
    if(ok) for(let i=0;i<len;i++) score[r+(h?0:i)][c+(h?i:0)]++;
  }
  let best=-1, picks=[];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(open(r,c)){
    const s = score[r][c] + Math.random()*0.5;
    if(s>best){best=s;picks=[[r,c]];}
  }
  return picks[0];
}
function aiTurn(){
  if(state.phase!=="battle") return;
  const [r,c] = aiPick();
  const res = fire(state.player,r,c);
  log(`El enemigo dispara a ${name(r,c)}: ${res.result==="miss"?"agua.":res.result==="hit"?"¡TOCÓ tu "+res.ship.name+"!":"¡HUNDIÓ tu "+res.ship.name+"!"}`);
  if(allSunk(state.player)){ state.phase="over"; render(); setStatus("¡Derrota! El enemigo hundió toda tu flota."); log("Gana el enemigo."); announce(false); return; }
  state.turn="player"; render();
  setStatus(`El enemigo ${res.result==="miss"?"falló en":res.result==="hit"?"te tocó en":"hundió tu "+res.ship.name+" en"} ${name(r,c)}. ¡Tu turno, dispara!`);
}

function init(){
  state = {phase:"placing", turn:"player", horiz:true, player:newBoard(), enemy:newBoard(), hover:null};
  randomFleet(state.enemy);
  buildGrid($("player"), clickPlace, hoverPlace);
  buildGrid($("enemy"), playerFire);
  $("log").innerHTML="";
  hideResult();
  setStatus(`Coloca tu ${FLEET[0][0]} (${FLEET[0][1]}).`);
  render();
}
function rotate(){ state.horiz=!state.horiz; render(); if(state.hover) hoverPlace(...state.hover); }

$("rotate").onclick = rotate;
document.addEventListener("keydown",e=>{ if((e.key==="r"||e.key==="R") && state.phase==="placing") rotate(); });
$("random").onclick = ()=>{ state.player=newBoard(); randomFleet(state.player); render(); setStatus("¡Flota lista! Presiona «Iniciar batalla»."); };
$("reset").onclick = ()=>{ state.player=newBoard(); render(); setStatus(`Coloca tu ${FLEET[0][0]} (${FLEET[0][1]}).`); };
$("start").onclick = ()=>{ state.phase="battle"; state.turn="player"; render(); setStatus("¡Comienza la batalla! Haz clic en una casilla de «Aguas enemigas» para disparar."); log("Comienza la batalla."); };
$("again").onclick = init;
$("result-again").onclick = init;
$("result-close").onclick = hideResult;
$("result").addEventListener("click",e=>{ if(e.target.id==="result") hideResult(); });
document.addEventListener("keydown",e=>{
  if(!$("result").classList.contains("show")) return;
  if(e.key==="Escape") hideResult();
  if(e.key==="Tab"){
    const btns=[...$("result").querySelectorAll("button")], i=btns.indexOf(document.activeElement);
    e.preventDefault();
    btns[(i + (e.shiftKey?-1:1) + btns.length) % btns.length].focus();
  }
});
new ResizeObserver(()=>document.body.style.paddingBottom = $("stocks").offsetHeight + 16 + "px").observe($("stocks"));
